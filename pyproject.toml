[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL"]
ignore = [
    "PLR09",   # size and complexity limits
    "PLR2004", # magic-value-comparison
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# Test classes hold fixture data as class attributes; setUpModule() stores module state.
"tests/**" = ["RUF012", "PLW0603"]
