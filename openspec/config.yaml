schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours
rules:
  proposal:
    - State problems and outcomes.
    - What Changes describes observable outcomes, not the mechanism that produces them.
    - The proposal precedes the design. It contains nothing derived from a design decision.
  design:
    - Goals state properties the solution must have that the proposal does not state, such as safety, compatibility, ordering or testability. Goals refer to the proposal for its outcomes instead of restating them.
    - A goal constrains the solution without selecting it. More than one design could meet it. A statement that selects a path, module, function or tool belongs in Decisions.
    - Non-Goals list design-level exclusions. Scope the proposal already defers is not restated.
    - Each Decision serves a goal, a Context constraint or a proposal outcome. A Decision that serves none is removed.
    - Rejected alternatives belong under the Decision they relate to.
    - Context describes the flow the change touches, as it was before the change. A fact belongs in Context when more than one Decision, Risk or Migration Plan step cites it. A fact cited by none is removed.
    - A sentence or diagram in any section that describes behavior before the change says so and uses the past tense, e.g. "Before this change, `bench/cli.py` took two `SHA:LABEL` arguments." A block of such sentences can share one lead-in, e.g. "Before this change:" above a diagram. A sentence in the present tense describes behavior after the change.
    - A Decision opens with a paragraph labelled **Before this change:** that holds the facts it depends on that Context does not hold, when it has any. The choice follows in a paragraph labelled **After this change:**. A Decision with no such facts opens with the **After this change:** paragraph.
    - A flow or a folder layout the reader needs to follow the design is drawn as a plain-text diagram or a file tree in a code block. The drawing replaces the prose it shows. Diagrams use ASCII characters only.
    - Context names the containers, data stores and external systems the change touches, and their relationships, as listed in docs/structurizr/workspace.dsl.
    - A Decision that adds, removes or changes a relationship listed in docs/structurizr/workspace.dsl names that relationship.
  tasks:
    - A change that adds, removes or changes a relationship listed in docs/structurizr/workspace.dsl includes a task to update the DSL.

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
