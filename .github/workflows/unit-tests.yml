name: Unit tests

on:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          # The checkout is bind-mounted into the test container, so a persisted
          # token would be readable from inside it. Nothing here writes to git.
          persist-credentials: false

      - name: Build the container image
        run: podman build -t job-search-agent:ci .

      - name: Run unit tests in the container
        run: >
          podman run --rm
          -v "$PWD:/workspace"
          -w /workspace
          job-search-agent:ci
          python3 -m unittest discover -s tests/unit
